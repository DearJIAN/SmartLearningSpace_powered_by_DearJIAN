<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>统计报表 - 个人记账系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- ECharts 图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="fas fa-wallet me-2"></i>MyBookkeeping</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/index">账单明细</a></li>
                <li class="nav-item"><a class="nav-link active" href="/analysis">统计报表</a></li>
                <li class="nav-item"><a class="nav-link" href="/treemap">资金流向树</a></li>
                <!-- 👇 新增导航项 -->
                <li class="nav-item"><a class="nav-link" href="/calendar">账单日历</a></li>
                <li class="nav-item">
                    <a class="nav-link fw-bold text-warning" href="/insight/view/dashboard">
                        <i class="fas fa-lightbulb me-1"></i>洞察中心
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-secondary mb-0"><i class="fas fa-chart-line me-2"></i>财务分析看板</h3>

        <!-- 👇 新增：日期范围筛选表单 -->
        <form action="/analysis" class="d-flex gap-2" method="get">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="far fa-calendar-alt"></i></span>
                <input class="form-control border-start-0 ps-0" name="startDate" placeholder="开始日期" th:value="${startDate}"
                       type="date">
                <span class="input-group-text bg-white border-0">至</span>
                <input class="form-control border-start-0" name="endDate" placeholder="结束日期" th:value="${endDate}"
                       type="date">
            </div>
            <button class="btn btn-primary" type="submit">分析</button>
            <a class="btn btn-outline-secondary" href="/analysis">重置</a>
        </form>
    </div>

    <!-- 1. 趋势分析 -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white">
            <h5 class="mb-0">月度收支趋势</h5>
        </div>
        <div class="card-body">
            <div id="trendChart" style="width: 100%; height: 400px;"></div>
        </div>
    </div>

    <!-- 👇 新增：日度趋势分析图表 -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white">
            <h5 class="mb-0">📈 日度波动 (支持缩放)</h5>
        </div>
        <div class="card-body">
            <div id="dailyChart" style="width: 100%; height: 400px;"></div>
        </div>
    </div>

    <!-- 2. 构成分析 -->
    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white text-danger">
                    <h5 class="mb-0">💸 支出类别构成</h5>
                </div>
                <div class="card-body">
                    <div id="expensePieChart" style="width: 100%; height: 350px;"></div>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white text-success">
                    <h5 class="mb-0">💰 收入类别构成</h5>
                </div>
                <div class="card-body">
                    <div id="incomePieChart" style="width: 100%; height: 350px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 📊 新增企业级报表区域 -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white"><h5 class="mb-0">🏆 支出 TOP5 排行</h5></div>
                <div class="card-body">
                    <div id="top5Chart" style="height: 350px;"></div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white"><h5 class="mb-0">🆚 收支同比/环比分析</h5></div>
                <div class="card-body">
                    <div id="yoyChart" style="height: 350px;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white"><h5 class="mb-0">🔢 消费频率 (次数)</h5></div>
                <div class="card-body">
                    <div id="freqChart" style="height: 350px;"></div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white"><h5 class="mb-0">🗓️ 星期消费习惯</h5></div>
                <div class="card-body">
                    <div id="weeklyChart" style="height: 350px;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-8">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white"><h5 class="mb-0">📉 预算消耗趋势</h5></div>
                <div class="card-body">
                    <div id="budgetTrendChart" style="height: 350px;"></div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white"><h5 class="mb-0">⚠️ 预算风险预警</h5></div>
                <div class="card-body">
                    <div id="budgetRiskChart" style="height: 350px;"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-5">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white"><h5 class="mb-0">🏥 综合财务健康指数</h5></div>
                <div class="card-body d-flex justify-content-center">
                    <div id="healthChart" style="width: 800px; height: 500px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // ✅ 推荐写法：
    // ✅ 修复版：使用 JSON.parse 解析字符串
    // 如果后端传的是 "{}" 字符串，解析后就是空对象，不会报错
    const analysisData = JSON.parse(/*[[${dataJson}]]*/ '{}');
    const enhancedData = JSON.parse(/*[[${enhancedDataJson}]]*/ '{}');


    console.log("Loaded Data:", analysisData);
    console.log("Loaded Enhanced:", enhancedData);

    // --- 1. 月度趋势图 ---
    const trendChart = echarts.init(document.getElementById('trendChart'));
    if (analysisData && analysisData.monthly) {
        const months = Object.keys(analysisData.monthly);
        const incomeData = months.map(m => analysisData.monthly[m][0]);
        const expenseData = months.map(m => analysisData.monthly[m][1]);

        trendChart.setOption({
            tooltip: {trigger: 'axis'},
            legend: {data: ['收入', '支出'], top: '0%', left: 'center', padding: 10},
            grid: {left: '3%', right: '4%', bottom: '3%', top: '12%', containLabel: true},
            xAxis: {type: 'category', boundaryGap: false, data: months},
            yAxis: {type: 'value'},
            series: [
                {
                    name: '收入',
                    type: 'line',
                    smooth: true,
                    data: incomeData,
                    itemStyle: {color: '#198754'},
                    areaStyle: {opacity: 0.1}
                },
                {
                    name: '支出',
                    type: 'line',
                    smooth: true,
                    data: expenseData,
                    itemStyle: {color: '#dc3545'},
                    areaStyle: {opacity: 0.1}
                }
            ]
        });
    }

    // --- 日度趋势图 ---
    const dailyChart = echarts.init(document.getElementById('dailyChart'));
    if (analysisData && analysisData.daily) {
        const days = Object.keys(analysisData.daily);
        const dailyIncome = days.map(d => analysisData.daily[d][0]);
        const dailyExpense = days.map(d => analysisData.daily[d][1]);

        dailyChart.setOption({
            tooltip: {trigger: 'axis'},
            legend: {data: ['收入', '支出', '收入趋势', '支出趋势'], top: '0%'},
            grid: {left: '3%', right: '4%', bottom: '15%', top: '12%', containLabel: true},
            xAxis: {type: 'category', data: days},
            yAxis: {type: 'value'},
            dataZoom: [{type: 'slider', show: true, xAxisIndex: [0], start: 0, end: 100, bottom: 10}],
            series: [
                {
                    name: '收入',
                    type: 'bar',
                    barMaxWidth: 30,
                    data: dailyIncome,
                    itemStyle: {color: '#198754', borderRadius: [3, 3, 0, 0]}
                },
                {
                    name: '支出',
                    type: 'bar',
                    barMaxWidth: 30,
                    data: dailyExpense,
                    itemStyle: {color: '#dc3545', borderRadius: [3, 3, 0, 0]}
                },
                {name: '收入趋势', type: 'line', smooth: true, data: dailyIncome, itemStyle: {color: '#20c997'}},
                {name: '支出趋势', type: 'line', smooth: true, data: dailyExpense, itemStyle: {color: '#ff6b6b'}}
            ]
        });
    }

    // --- 2. 支出饼图 ---
    const expensePieChart = echarts.init(document.getElementById('expensePieChart'));
    if (analysisData && analysisData.expensePie) {
        const expensePieData = Object.entries(analysisData.expensePie).map(([name, value]) => ({name, value}));
        expensePieChart.setOption({
            tooltip: {trigger: 'item', formatter: '{b}: {c} ({d}%)'},
            legend: {bottom: '0%'},
            series: [{
                type: 'pie',
                radius: ['40%', '70%'],
                itemStyle: {borderRadius: 10, borderColor: '#fff', borderWidth: 2},
                data: expensePieData.length ? expensePieData : [{name: '无数据', value: 0}]
            }]
        });
    }

    // --- 3. 收入饼图 ---
    const incomePieChart = echarts.init(document.getElementById('incomePieChart'));
    if (analysisData && analysisData.incomePie) {
        const incomePieData = Object.entries(analysisData.incomePie).map(([name, value]) => ({name, value}));
        incomePieChart.setOption({
            tooltip: {trigger: 'item', formatter: '{b}: {c} ({d}%)'},
            legend: {bottom: '0%'},
            series: [{
                type: 'pie',
                radius: '50%',
                data: incomePieData.length ? incomePieData : [{name: '无数据', value: 0}],
                color: ['#91cc75', '#5470c6', '#fac858', '#ee6666', '#73c0de']
            }]
        });
    }

    // --- 📊 4. [新增] 支出 Top 5 ---
    if (enhancedData && enhancedData.top5) {
        const top5Chart = echarts.init(document.getElementById('top5Chart'));
        const t5 = enhancedData.top5;
        top5Chart.setOption({
            grid: {left: '3%', right: '10%', bottom: '3%', containLabel: true},
            xAxis: {type: 'value'},
            yAxis: {type: 'category', data: t5.map(i => i.category), inverse: true}, // inverse让第一名在上面
            tooltip: {trigger: 'axis'},
            series: [{
                type: 'bar',
                data: t5.map(i => i.amount),
                itemStyle: {color: '#fd7e14'},
                label: {show: true, position: 'right'}
            }]
        });
        window.addEventListener('resize', () => top5Chart.resize());
    }

    // --- 📊 5. [新增] 同比/环比 ---
    if (enhancedData && enhancedData.yoy) {
        const yoyChart = echarts.init(document.getElementById('yoyChart'));
        const yoy = enhancedData.yoy;
        yoyChart.setOption({
            tooltip: {trigger: 'axis', axisPointer: {type: 'shadow'}},
            legend: {data: ['本期', '上期']},
            xAxis: {type: 'category', data: ['收入', '支出']},
            yAxis: {type: 'value'},
            series: [
                {
                    name: '本期',
                    type: 'bar',
                    data: [yoy.current.income, yoy.current.expense],
                    itemStyle: {color: '#0d6efd'}
                },
                {
                    name: '上期',
                    type: 'bar',
                    data: [yoy.previous.income, yoy.previous.expense],
                    itemStyle: {color: '#adb5bd'}
                }
            ]
        });
        window.addEventListener('resize', () => yoyChart.resize());
    }

    // --- 📊 6. [新增] 消费频率 ---
    if (enhancedData && enhancedData.freq) {
        const freqChart = echarts.init(document.getElementById('freqChart'));
        freqChart.setOption({
            xAxis: {type: 'category', data: enhancedData.freq.map(i => i.category), axisLabel: {rotate: 45}},
            yAxis: {type: 'value'},
            tooltip: {trigger: 'axis'},
            series: [{type: 'bar', data: enhancedData.freq.map(i => i.count), itemStyle: {color: '#6610f2'}}]
        });
        window.addEventListener('resize', () => freqChart.resize());
    }

    // --- 📊 7. [新增] 星期消费 ---
    if (enhancedData && enhancedData.weekly) {
        const weeklyChart = echarts.init(document.getElementById('weeklyChart'));
        const wDays = Object.keys(enhancedData.weekly);
        const wVals = Object.values(enhancedData.weekly);
        weeklyChart.setOption({
            xAxis: {type: 'category', data: wDays},
            yAxis: {type: 'value'},
            tooltip: {trigger: 'axis'},
            series: [{type: 'bar', data: wVals, itemStyle: {color: '#20c997'}}]
        });
        window.addEventListener('resize', () => weeklyChart.resize());
    }

    // --- 📊 8. [新增] 预算趋势 ---
    if (enhancedData && enhancedData.budgetTrend) {
        const btChart = echarts.init(document.getElementById('budgetTrendChart'));
        const trend = enhancedData.budgetTrend;
        const budgetLine = trend.dailyUsed.map(d => trend.budget);
        const usedLine = trend.dailyUsed.map(d => d.used);
        const dates = trend.dailyUsed.map(d => d.date);

        btChart.setOption({
            tooltip: {trigger: 'axis'},
            legend: {data: ['预算限额', '累积支出']},
            xAxis: {type: 'category', data: dates},
            yAxis: {type: 'value'},
            series: [
                {
                    name: '预算限额',
                    type: 'line',
                    data: budgetLine,
                    lineStyle: {type: 'dashed', color: 'red'},
                    symbol: 'none'
                },
                {
                    name: '累积支出',
                    type: 'line',
                    data: usedLine,
                    areaStyle: {opacity: 0.2},
                    itemStyle: {color: '#0d6efd'}
                }
            ]
        });
        window.addEventListener('resize', () => btChart.resize());
    }

    // --- 📊 9. [新增] 预算风险 ---
    if (enhancedData && enhancedData.budgetRisk) {
        const riskChart = echarts.init(document.getElementById('budgetRiskChart'));
        const rate = enhancedData.budgetRisk.rate || 0;
        riskChart.setOption({
            series: [{
                type: 'gauge',
                progress: {show: true},
                detail: {valueAnimation: true, formatter: '{value}%', fontSize: 20},
                data: [{value: rate, name: '消耗率'}],
                axisLine: {lineStyle: {color: [ [0.6, '#91cc75'], [0.9, '#fac858'], [1, '#ff6b6b'] ]}}
            }]
        });
        window.addEventListener('resize', () => riskChart.resize());
    }

    // --- 📊 10. [新增] 健康雷达 ---
    if (enhancedData && enhancedData.health) {
        const hChart = echarts.init(document.getElementById('healthChart'));
        const h = enhancedData.health;
        hChart.setOption({
            tooltip: {},
            radar: {
                indicator: [
                    {name: '储蓄率', max: 1},
                    {name: '收支平衡', max: 1},
                    {name: '支出结构健康度', max: 1},
                    {name: '消费稳定性', max: 1}
                ]
            },
            series: [{
                type: 'radar',
                itemStyle: {color: '#0dcaf0'},
                areaStyle: {opacity: 0.2},
                data: [{
                    value: [
                        h.savingRate,
                        h.balance,
                        (1 - (h.expenseFocus || 0)),
                        h.stability
                    ],
                    name: '财务健康度'
                }]
            }]
        });
        window.addEventListener('resize', () => hChart.resize());
    }

    // 窗口大小改变时重绘
    window.addEventListener('resize', () => {
        trendChart.resize();
        dailyChart.resize();
        expensePieChart.resize();
        incomePieChart.resize();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
