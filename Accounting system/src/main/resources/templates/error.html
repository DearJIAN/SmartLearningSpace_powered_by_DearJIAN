<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>系统出错</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow" style="max-width: 600px; width: 100%;">
    <div class="card-header bg-danger text-white">
        <h5 class="mb-0">⚠️ 发生错误</h5>
    </div>
    <div class="card-body">
        <h6 class="card-subtitle mb-2 text-muted" th:text="${exceptionType}">Exception Type</h6>
        <p class="card-text text-danger font-monospace bg-light p-3 border rounded" th:text="${errorMessage}">
            Unknown Error
        </p>
        <div class="alert alert-info small">
            <strong>排查建议：</strong><br>
            1. 检查 application.yml 中的数据库 <b>password</b> 是否修改为你自己的密码。<br>
            2. 检查数据库 <b>personal_bookkeeping</b> 和表是否已创建。<br>
            3. 查看 IDEA 控制台的红色日志获取完整堆栈。
        </div>
        <a class="btn btn-secondary mt-3" href="/login">返回登录页</a>
    </div>
</div>
</body>
</html>
