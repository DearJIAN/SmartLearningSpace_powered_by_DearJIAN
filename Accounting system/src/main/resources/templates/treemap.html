<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>资金流向树 - 个人记账系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        .chart-container {
            width: 100%;
            height: calc(100vh - 80px);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="fas fa-wallet me-2"></i>MyBookkeeping</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/index">账单明细</a></li>
                <li class="nav-item"><a class="nav-link" href="/analysis">统计报表</a></li>
                <li class="nav-item"><a class="nav-link active fw-bold" href="/treemap">📊 资金流向树</a></li>
                <!-- 👇 新增导航项 -->
                <li class="nav-item"><a class="nav-link" href="/calendar">账单日历</a></li>
                <li class="nav-item">
                    <a class="nav-link fw-bold text-warning" href="/insight/view/dashboard">
                        <i class="fas fa-lightbulb me-1"></i>洞察中心
                    </a>
                </li>
            </ul>
        </div>
        <!-- 简单的日期筛选 -->
        <form action="/treemap" class="d-flex" method="get">
            <input class="form-control me-2 form-control-sm" name="startDate" th:value="${startDate}" type="date">
            <input class="form-control me-2 form-control-sm" name="endDate" th:value="${endDate}" type="date">
            <button class="btn btn-sm btn-light text-primary" type="submit">过滤</button>
        </form>
    </div>
</nav>

<div class="container-fluid pt-2">
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="chart-container" id="treeChart"></div>
            <!-- 无数据提示 -->
            <div id="noData"
                 style="display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#6c757d;font-size:18px;">
                暂无数据，调整筛选条件或检查后端数据
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // 将 Thymeleaf 表达式放在 JS 注释占位符中，并提供空数组作为回退值
    const treeData = /*[[${treeData}]]*/ [];

    // 调试输出，查看渲染后的内容（在浏览器控制台查看）
    console.log('treemap treeData:', treeData);

    // 兼容处理：后端有时会传单个对象而不是数组
    let preparedData = treeData;
    if (treeData && !Array.isArray(treeData)) {
        preparedData = [treeData];
    }

    const noDataEl = document.getElementById('noData');
    const chartEl = document.getElementById('treeChart');

    // 若没有有效数据，显示提示并退出
    if (!preparedData || !Array.isArray(preparedData) || preparedData.length === 0) {
        if (noDataEl) noDataEl.style.display = 'block';
    } else {
        if (noDataEl) noDataEl.style.display = 'none';
        try {
            const chart = echarts.init(chartEl);

            chart.setOption({
                tooltip: {
                    trigger: 'item',
                    triggerOn: 'mousemove',
                    formatter: function (params) {
                        if (params.data && params.data.value) {
                            return `${params.name}`;
                        }
                        return params.name;
                    }
                },
                series: [
                    {
                        type: 'tree',
                        data: preparedData,
                        top: '1%',
                        left: '7%',
                        bottom: '1%',
                        right: '25%',
                        symbolSize: 12,
                        label: {
                            position: 'left',
                            verticalAlign: 'middle',
                            align: 'right',
                            fontSize: 14
                        },
                        leaves: {
                            label: {
                                position: 'right',
                                verticalAlign: 'middle',
                                align: 'left'
                            }
                        },
                        emphasis: {
                            focus: 'descendant'
                        },
                        expandAndCollapse: true,
                        animationDuration: 550,
                        animationDurationUpdate: 750
                    }
                ]
            });

            window.addEventListener('resize', () => chart.resize());
        } catch (e) {
            console.error('ECharts 初始化/渲染出错：', e);
            if (noDataEl) {
                noDataEl.style.display = 'block';
                noDataEl.textContent = '图表渲染失败，请查看控制台错误信息';
            }
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
