<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>账单日历 - 个人记账系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- Calendar cell basic (no FullCalendar dependency) --- */
        .fc-day {
            box-sizing: border-box;
            position: relative;
            background: #ebebeb;
            border: none;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            transition: transform .12s ease, box-shadow .12s ease;
        }

        .fc-day:hover {
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        .fc-day .events {
            width: 100%;
        }

        /* 结余数字样式 */
        .balance-label {
            position: absolute;
            bottom: 6px;
            right: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            color: #0d6efd;
            background: rgba(255, 255, 255, 0.8);
            padding: 0 6px;
            border-radius: 4px;
            pointer-events: none;
        }

        /* ========== 新增：日历右侧抽屉 & 年/月 Tab 样式 ========== */
        .calendar-tabs {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 12px;
        }

        .calendar-tabs .nav .nav-link {
            padding: 6px 12px;
            border-radius: 6px;
        }

        .calendar-body {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }

        .calendar-main {
            flex: 1 1 auto;
            min-width: 0;
            width: 70%;
        }

        /* 抽屉 */
        .drawer {
            width: 380px;
            max-width: 40%;
            background: #fff;
            border-left: 1px solid #e9ecef;
            box-shadow: -8px 0 24px rgba(0, 0, 0, 0.06);
            transform: translateX(100%);
            transition: transform .28s ease;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer .drawer-header {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f3f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer .drawer-body {
            padding: 12px 16px;
            overflow-y: auto;
        }

        .drawer .tx-item {
            padding: 10px;
            border-bottom: 1px dashed #f1f3f5;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .day-amount {
            display: block;
            font-size: 0.9rem;
            margin-top: 6px;
            color: #8b8f8f;
        }

        /* Date label */
        .date-label {
            font-weight: 700;
            font-size: 1.1rem;
            color: #222;
        }

        /* Selected cell */
        .fc-day.selected {
            background-color: #8dc0fb !important;
        }

        .fc-day.selected .date-label, .fc-day.selected .day-amount {
            color: #004fff !important;
        }

        /* Week header styling */
        .cal-weekday {
            text-align: center;
            color: #8c8d8f;
            font-weight: 400;
        }

        /* Transaction item card styles */
        .tx-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.04);
            cursor: default; /* keep arrow cursor on hover */
            transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
            margin-bottom: 8px;
        }

        .tx-item .left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1 1 auto;
        }

        .tx-item .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ebebeb;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            flex: 0 0 36px;
            font-size: 14px;
            border: 2px solid rgba(0, 0, 0, 0.02);
        }

        .tx-item .avatar i {
            font-size: 14px;
        }

        .tx-item .meta {
            overflow: hidden;
        }

        .tx-item .type {
            font-weight: 600;
            color: #000;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .tx-item .time-remark {
            font-size: 0.82rem;
            color: #6c757d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tx-item .amount {
            font-weight: 700;
            margin-left: 12px;
            white-space: nowrap;
            flex: 0 0 auto;
            text-align: right;
        }

        /* Positive / negative color variants */
        .tx-item.positive .avatar {
            color: #3db587;
        }

        .tx-item.positive .amount {
            color: #3db587;
        }

        .tx-item.negative .avatar {
            color: #dd606e;
        }

        .tx-item.negative .amount {
            color: #dd606e;
        }

        /* Hover effect */
        .tx-item:hover {
            background: #d9eafe;
            transform: translateY(-3px);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.12);
            cursor: default;
        }

        .tx-item:hover .type {
            color: #3a92ef;
        }

        /* 在小屏上抽屉占满屏幕右侧 */
        @media (max-width: 768px) {
            .drawer {
                position: fixed;
                right: 0;
                top: 56px;
                bottom: 0;
                z-index: 1050;
                max-width: 100%;
                width: 92%;
            }
        }
    </style>
</head>

<div class="container-fluid px-4">
    <div class="row">
        <!-- 左侧筛选栏 -->
        <div class="col-md-2 mb-3">
            <!-- 1. 视图模式控制 (新增) -->
            <div class="card shadow-sm mb-3" style="display: none">
                <div class="card-header bg-white">
                    <h6 class="mb-0">🎨 热力视图模式</h6>
                </div>
                <div class="card-body p-2 d-grid gap-2">
                    <input checked class="btn-check" id="modeAll" name="viewMode" onchange="changeViewMode('all')" type="radio"
                           value="all">
                    <label class="btn btn-outline-secondary btn-sm text-start" for="modeAll">
                        <i class="fas fa-balance-scale me-1"></i> 全局热力 (红绿)
                    </label>

                    <input class="btn-check" id="modeLoss" name="viewMode" onchange="changeViewMode('loss')" type="radio"
                           value="loss">
                    <label class="btn btn-outline-danger btn-sm text-start" for="modeLoss">
                        <i class="fas fa-arrow-down me-1"></i> 只看亏损 (红)
                    </label>

                    <input class="btn-check" id="modeGain" name="viewMode" onchange="changeViewMode('gain')" type="radio"
                           value="gain">
                    <label class="btn btn-outline-success btn-sm text-start" for="modeGain">
                        <i class="fas fa-arrow-up me-1"></i> 只看盈利 (绿)
                    </label>

                    <input class="btn-check" id="modeBalance" name="viewMode" onchange="changeViewMode('balance')" type="radio"
                           value="balance">
                    <label class="btn btn-outline-primary btn-sm text-start" for="modeBalance">
                        <i class="fas fa-calculator me-1"></i> 纯结余视图 (蓝)
                    </label>
                </div>
            </div>

            <!-- 2. 筛选条件 (保留) -->
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h6 class="mb-0">事件过滤</h6>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label small">收支类型</label>
                        <select class="form-select form-select-sm" id="typeFilter" onchange="refetchEvents()">
                            <option value="">全部</option>
                            <option value="1">只看收入</option>
                            <option value="2">只看支出</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">分类</label>
                        <select class="form-select form-select-sm" id="catFilter" onchange="refetchEvents()">
                            <option value="">全部</option>
                            <option th:each="c : ${categories}" th:text="${c.name}" th:value="${c.id}"></option>
                        </select>
                    </div>
                    <button class="btn btn-sm btn-outline-primary w-100" onclick="refetchEvents()">刷新日历</button>
                    <hr>
                    <div class="small text-muted">包含：<br> <span class="text-success">■</span> 收入 <span
                            class="text-danger">■</span> 支出
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧日历主体（改为年/月 tab + 月视图 + 右侧抽屉） -->
        <div class="col-md-10">
            <div class="card shadow-sm">
                <div class="card-body p-2">
                    <!--                    <div class="calendar-tabs mb-2">-->
                    <!--                        <ul class="nav nav-pills" role="tablist">-->
                    <!--                            <li class="nav-item" role="presentation">-->
                    <!--                                <button class="nav-link" id="yearTabBtn" type="button" role="tab" onclick="switchToYear()">年</button>-->
                    <!--                            </li>-->
                    <!--                            <li class="nav-item" role="presentation">-->
                    <!--                                <button class="nav-link active" id="monthTabBtn" type="button" role="tab" onclick="switchToMonth()">月</button>-->
                    <!--                            </li>-->
                    <!--                        </ul>-->
                    <!--                    </div>-->

                    <div class="calendar-body">
                        <div class="calendar-main">
                            <div id='calendar'></div>
                        </div>

                        <!-- 右侧抽屉 -->
                        <div aria-hidden="false" class="drawer open" id="dayDrawer">
                            <div class="drawer-header">
                                <div>
                                    <div class="fw-bold" id="drawerDate">选择日期</div>
                                    <div class="small text-muted" id="drawerTotal">合计：￥0.00</div>
                                </div>
                                <!-- 抽屉固定为打开状态，已移除关闭按钮 -->
                            </div>
                            <div class="drawer-body" id="drawerBody">
                                <!-- 每日流水项会动态插入；默认提示为未选择日期时显示 -->
                                <div class="text-muted small">点击左侧日期以显示详细信息</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 详情弹窗 (保持不变) -->
<div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">账单详情</h6>
                <button class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>
            <div class="modal-body">
                <p><strong>分类：</strong> <span id="modalCat"></span></p>
                <p><strong>金额：</strong> <span class="fw-bold" id="modalAmount"></span></p>
                <p><strong>日期：</strong> <span id="modalDate"></span></p>
                <p class="mb-0"><strong>备注：</strong></p>
                <div class="p-2 bg-light rounded text-muted small" id="modalRemark"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/calendar.js"></script>
<script>
    // Debug helper to confirm template and static JS are reachable
    try {
        console.log('[calendar.html] template loaded');
        fetch('/js/calendar.js').then(r => {
            console.log('[calendar.html] /js/calendar.js status', r.status);
            return r.text();
        }).then(txt => {
            // only log small portion to avoid clogging
            console.log('[calendar.html] /js/calendar.js preview:', txt.slice(0, 120));
        }).catch(e => {
            console.warn('[calendar.html] /js/calendar.js fetch failed', e);
        });
    } catch (e) {
        console.warn('[calendar.html] debug script failed', e);
    }

    // Post-load sanity check: attempt to call renderCalendar and surface errors visibly in the page
    setTimeout(() => {
        try {
            if (typeof renderCalendar === 'function') {
                try {
                    renderCalendar();
                    console.log('[calendar.html] renderCalendar invoked from sanity check');
                } catch (e) {
                    console.error('[calendar.html] renderCalendar threw', e);
                    const el = document.getElementById('calendar');
                    if (el) el.innerHTML = `<div class="alert alert-danger p-3">日历初始化失败：${(e && e.message) || e}</div>`;
                }
            } else {
                console.warn('[calendar.html] renderCalendar not defined');
                const el = document.getElementById('calendar');
                if (el) el.innerHTML = '<div class="text-center text-muted p-3">日历脚本未加载或初始化失败，请查看控制台</div>';
            }

            const cal = document.getElementById('calendar');
            if (cal && cal.children.length === 0) {
                cal.innerHTML = '<div class="text-center text-muted p-3">日历未能加载（无内容），请在控制台查看错误信息。</div>';
            }
        } catch (err) {
            console.error('[calendar.html] sanity check failed', err);
            const el = document.getElementById('calendar');
            if (el) el.innerHTML = '<div class="alert alert-danger p-3">日历初始化检测遇到错误，请查看控制台</div>';
        }
    }, 120);

    // --- Sync drawer max-height to left calendar height ---
    (function () {
        const drawer = document.getElementById('dayDrawer');
        const calendarMain = document.querySelector('.calendar-main');
        if (!drawer || !calendarMain) return;

        function setDrawerMaxHeight() {
            try {
                // measure calendar-main height (content box)
                const rect = calendarMain.getBoundingClientRect();
                // if height is zero (not rendered yet), skip
                if (!rect || rect.height <= 0) return;
                drawer.style.maxHeight = Math.round(rect.height) + 'px';
            } catch (e) {
                console.warn('[calendar.html] setDrawerMaxHeight failed', e);
            }
        }

        // debounce helper
        function debounce(fn, wait) {
            let t = null;
            return function () {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, arguments), wait);
            };
        }

        const debouncedSet = debounce(setDrawerMaxHeight, 120);

        // run once after short delay to allow initial layout
        setTimeout(setDrawerMaxHeight, 200);
        setTimeout(setDrawerMaxHeight, 800);

        // run on resize
        window.addEventListener('resize', debouncedSet);

        // observe calendar content changes (e.g., when calendar is rendered or refreshed)
        const calEl = document.getElementById('calendar');
        if (calEl && window.MutationObserver) {
            const mo = new MutationObserver(debouncedSet);
            mo.observe(calEl, {childList: true, subtree: true, attributes: true});
        }

        // also observe changes to left sidebar that might affect height
        const leftCol = document.querySelector('.calendar-main');
        if (leftCol && window.MutationObserver) {
            const mo2 = new MutationObserver(debouncedSet);
            mo2.observe(leftCol, {childList: true, subtree: true, attributes: true});
        }

        // expose for debugging
        window._syncDrawerHeight = setDrawerMaxHeight;
    })();
</script>
</body>
