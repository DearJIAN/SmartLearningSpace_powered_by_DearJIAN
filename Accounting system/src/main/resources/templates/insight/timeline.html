<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>财务时光机</title>
    <style>
        body {
            font-family: '微软雅黑', sans-serif;
            background-color: #f5f7fa;
            padding: 20px;
        }

        .nav-bar {
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 4px;
        }

        .nav-bar a {
            text-decoration: none;
            color: #409EFF;
            margin-right: 15px;
            font-weight: bold;
        }

        .timeline {
            border-left: 2px solid #e4e7ed;
            margin-left: 20px;
            padding-left: 20px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }

        .timeline-dot {
            position: absolute;
            left: -26px;
            top: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e4e7ed;
            border: 2px solid #fff;
        }

        .timeline-dot.key {
            background: #f56c6c;
            width: 14px;
            height: 14px;
            left: -28px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card.key-event {
            border-left: 4px solid #f56c6c;
        }

        .amount {
            color: #303133;
            font-weight: bold;
            float: right;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div class="nav-bar">
    <span>功能导航：</span>
    <a href="/index" style="color: #67C23A">🏠 返回首页</a>
    <a href="/insight/view/dashboard">洞察中心</a>
    <a href="/insight/view/profile">财务画像</a>
    <a href="/insight/view/timeline">时光机</a>
    <a href="/insight/view/risk">风险预警</a>
    <a href="/insight/view/goal">目标管理</a>
</div>

<h2>⏰ 财务时光机</h2>
<div class="timeline" id="timeline-box">加载中...</div>

<script>
    fetch('/api/insight/timeline')
        .then(res => res.json())
        .then(list => {
            const box = document.getElementById('timeline-box');
            if (!list || list.length === 0) {
                box.innerHTML = '<div style="color:#999">暂无数据</div>';
                return;
            }
            box.innerHTML = list.map(item => `
                    <div class="timeline-item">
                        <div class="timeline-dot ${item.isKeyInfo ? 'key' : ''}"></div>
                        <div style="font-size:13px;color:#909399;margin-bottom:5px;">${item.date}</div>
                        <div class="card ${item.isKeyInfo ? 'key-event' : ''}">
                            <span class="amount">￥${item.amount}</span>
                            <div style="font-weight:bold;">${item.category} ${item.isKeyInfo ? '<span style="color:red;font-size:12px">[大额]</span>' : ''}</div>
                        </div>
                    </div>
                `).join('');
        });
</script>
</body>
</html>
