<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>风险预警</title>
    <style>
        body {
            font-family: '微软雅黑', sans-serif;
            background-color: #f5f7fa;
            padding: 20px;
        }

        .nav-bar {
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 4px;
        }

        .nav-bar a {
            text-decoration: none;
            color: #409EFF;
            margin-right: 15px;
            font-weight: bold;
        }

        .alert-box {
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ebeef5;
            margin-bottom: 15px;
            background-color: #fdf6ec;
            color: #e6a23c;
            border-color: #faecd8;
        }

        .alert-box.warning {
            background-color: #fef0f0;
            color: #f56c6c;
            border-color: #fde2e2;
        }
    </style>
</head>
<body>
<div class="nav-bar">
    <span>功能导航：</span>
    <a href="/index" style="color: #67C23A">🏠 返回首页</a>
    <a href="/insight/view/dashboard">洞察中心</a>
    <a href="/insight/view/profile">财务画像</a>
    <a href="/insight/view/timeline">时光机</a>
    <a href="/insight/view/risk">风险预警</a>
    <a href="/insight/view/goal">目标管理</a>
</div>

<h2>🚨 风险预警中心</h2>
<div id="alert-container">检测中...</div>

<script>
    fetch('/api/insight/risk')
        .then(res => res.json())
        .then(alerts => {
            const container = document.getElementById('alert-container');
            if (!alerts || alerts.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #67C23A; margin-top: 50px; font-size: 20px;">✅ 当前财务状况健康，无异常风险。</div>';
            } else {
                container.innerHTML = alerts.map(alert => `
                        <div class="alert-box ${alert.level}">
                            <div style="font-weight: bold; margin-bottom: 5px;">${alert.title}</div>
                            <div>${alert.desc}</div>
                        </div>
                    `).join('');
            }
        });
</script>
</body>
</html>
