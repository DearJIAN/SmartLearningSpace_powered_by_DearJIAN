<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>财务画像</title>
    <style>
        body {
            font-family: '微软雅黑', sans-serif;
            background-color: #f5f7fa;
            padding: 20px;
            text-align: center;
        }

        .nav-bar {
            text-align: left;
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 4px;
        }

        .nav-bar a {
            text-decoration: none;
            color: #409EFF;
            margin-right: 15px;
            font-weight: bold;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: #409EFF;
            color: white;
            border-radius: 50%;
            line-height: 100px;
            font-size: 40px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            margin: 20px auto;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .progress-bg {
            background: #ebeef5;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar {
            height: 100%;
            background: #67C23A;
            width: 0%;
            transition: width 0.5s;
            text-align: right;
            color: white;
            line-height: 20px;
            font-size: 12px;
            padding-right: 5px;
        }
    </style>
</head>
<body>
<div class="nav-bar">
    <span>功能导航：</span>
    <a href="/index" style="color: #67C23A">🏠 返回首页</a>
    <a href="/insight/view/dashboard">洞察中心</a>
    <a href="/insight/view/profile">财务画像</a>
    <a href="/insight/view/timeline">时光机</a>
    <a href="/insight/view/risk">风险预警</a>
    <a href="/insight/view/goal">目标管理</a>
</div>

<h2>🧭 您的财务画像</h2>

<div id="content">
    <div class="avatar" id="score">?</div>
    <h1 id="type" style="color: #303133; margin: 20px 0;">分析中...</h1>

    <div class="card">
        <h3>💰 当前储蓄率</h3>
        <div class="progress-bg">
            <div class="progress-bar" id="saving-bar">0%</div>
        </div>
        <p id="saving-text" style="color: #909399; font-size: 14px;"></p>
    </div>
</div>

<script>
    fetch('/api/insight/profile')
        .then(res => res.json())
        .then(data => {
            document.getElementById('score').innerText = data.score || '?';
            document.getElementById('type').innerText = data.type || '未知类型';

            const rate = data.savingsRate || '0.0%';
            const rateVal = parseFloat(rate.replace('%', ''));
            const bar = document.getElementById('saving-bar');

            bar.style.width = Math.min(rateVal < 0 ? 0 : rateVal, 100) + '%';
            bar.innerText = rate;

            if (rateVal < 20) bar.style.background = '#f56c6c';
            else if (rateVal < 40) bar.style.background = '#e6a23c';

            document.getElementById('saving-text').innerHTML = `您的储蓄率：<strong>${rate}</strong><br>建议保持在 20% 以上。`;
        });
</script>
</body>
</html>
