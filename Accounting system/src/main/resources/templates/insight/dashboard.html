<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>消费洞察中心</title>
    <style>
        body {
            font-family: '微软雅黑', sans-serif;
            background-color: #f5f7fa;
            padding: 20px;
        }

        .nav-bar {
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 4px;
        }

        .nav-bar a {
            text-decoration: none;
            color: #409EFF;
            margin-right: 15px;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .tag {
            display: inline-block;
            padding: 5px 10px;
            background: #fef0f0;
            color: #f56c6c;
            border-radius: 4px;
            margin-right: 5px;
            font-size: 14px;
        }

        .success-text {
            color: #67C23A;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

        .cal-item {
            padding: 10px;
            background: #eee;
            text-align: center;
            border-radius: 4px;
        }

        .cal-item.high {
            background: #f56c6c;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="nav-bar">
    <span>功能导航：</span>
    <a href="/index" style="color: #67C23A">🏠 返回首页</a>
    <a href="/insight/view/dashboard">洞察中心</a>
    <a href="/insight/view/profile">财务画像</a>
    <a href="/insight/view/timeline">时光机</a>
    <a href="/insight/view/risk">风险预警</a>
    <a href="/insight/view/goal">目标管理</a>
</div>

<h2>💡 消费洞察中心</h2>

<div class="card">
    <h3>🚨 高风险类别 (占比>40%)</h3>
    <div id="category-box">加载中...</div>
</div>

<div class="card">
    <h3>📝 智能分析结论</h3>
    <p id="summary-text" style="color: #666; font-size: 16px;">加载中...</p>
</div>

<div class="card">
    <h3>📅 异常消费日期 (支出 > 日均1.5倍)</h3>
    <div class="cal-grid" id="calendar-box"></div>
</div>

<script>
    fetch('/api/insight/dashboard')
        .then(res => res.json())
        .then(data => {
            const catBox = document.getElementById('category-box');
            if (data.riskyCategories && data.riskyCategories.length > 0) {
                catBox.innerHTML = data.riskyCategories.map(c => `<span class="tag">${c}</span>`).join('');
            } else {
                catBox.innerHTML = '<span class="success-text">消费结构健康，无单一类别过度消费。</span>';
            }

            document.getElementById('summary-text').innerText = data.summaryText;

            const calBox = document.getElementById('calendar-box');
            if (data.highCostDays && data.highCostDays.length > 0) {
                calBox.innerHTML = data.highCostDays.map(day => `<div class="cal-item high">${day}<br>🔥</div>`).join('');
            } else {
                calBox.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#999;">本周期无异常高消费日</div>';
            }
        })
        .catch(e => console.error(e));
</script>
</body>
</html>
