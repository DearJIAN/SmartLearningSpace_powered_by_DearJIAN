<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>预算管理 - 个人记账系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .budget-card {
            border-radius: 24px;
            overflow: hidden;
            border: none;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .budget-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 80px rgba(102, 126, 234, 0.25);
        }

        .budget-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom: 4px solid rgba(255, 255, 255, 0.2);
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
        }

        .budget-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .budget-icon i {
            font-size: 2.5rem;
        }

        .progress-container {
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .progress-bar-animated {
            transition: width 1.5s ease-in-out;
        }

        .amount-display {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
            text-shadow: 0 4px 10px rgba(102, 126, 234, 0.2);
            letter-spacing: -1px;
        }

        .stats-card {
            border-radius: 18px;
            border: none;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            overflow: hidden;
        }

        .stats-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .stats-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .stats-icon.used {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .stats-icon.remaining {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .form-control-lg {
            border-radius: 12px;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }

        .form-control-lg:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="fas fa-wallet me-2"></i>MyBookkeeping</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/index"><i class="fas fa-list me-1"></i>账单明细</a></li>
                <li class="nav-item"><a class="nav-link active" href="/budget"><i class="fas fa-coins me-1"></i>预算管理</a>
                </li>
                <li class="nav-item"><a class="nav-link" href="/analysis"><i class="fas fa-chart-bar me-1"></i>统计报表</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-bold text-warning" href="/insight/view/dashboard">
                        <i class="fas fa-lightbulb me-1"></i>洞察中心
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card budget-card shadow-lg">
                <div class="card-header budget-header py-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="mb-0 fw-bold"><i class="fas fa-chart-pie me-2"></i>月度预算控制</h4>
                        <form action="/budget" method="get">
                            <div class="input-group input-group-lg" style="width: 220px;">
                                <span class="input-group-text bg-white border-end-0"><i class="far fa-calendar-alt"></i></span>
                                <input class="form-control border-start-0" name="month" onchange="this.form.submit()"
                                       th:value="${currentMonth}" type="month">
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card-body p-5">

                    <!-- 未设置预算状态 -->
                    <div class="text-center py-5" th:if="${data.total == 0}">
                        <div class="budget-icon mb-4"
                             style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                            <i class="fas fa-coins text-white"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-3 fs-2">本月未设置预算</h3>
                        <p class="text-muted mb-4 fs-5">合理规划开支，从设置预算开始</p>
                        <div class="bg-white p-5 rounded-4 shadow-sm" style="max-width: 600px; margin: 0 auto;">
                            <form action="/budget/set" class="row g-3 justify-content-center" method="post">
                                <input name="month" th:value="${currentMonth}" type="hidden">
                                <div class="col-md-7">
                                    <div class="input-group input-group-lg shadow-sm">
                                        <span class="input-group-text bg-white border-end-0"
                                              style="border-color: #dee2e6;"><i class="fas fa-wallet text-success"></i></span>
                                        <input class="form-control border-start-0 py-3" name="amount" placeholder="输入预算金额"
                                               required style="border-color: #dee2e6;" type="number">
                                    </div>
                                </div>
                                <div class="col-md-auto">
                                    <button class="btn btn-success btn-lg shadow-sm px-5 py-3 fw-bold" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); border: none;"
                                            type="submit">
                                        <i class="fas fa-save me-2"></i>设置预算
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- 已设置预算状态 -->
                    <div class="py-4" th:if="${data.total > 0}">
                        <div class="row align-items-center">
                            <div class="col-lg-6 text-center text-lg-start">
                                <div class="budget-icon mb-4">
                                    <i class="fas fa-chart-line"></i>
                                </div>
                                <h6 class="text-muted mb-3"><i class="fas fa-info-circle me-1"></i>本月总预算</h6>
                                <div class="amount-display" th:text="${'¥ ' + data.total}">¥ 5000</div>
                                <p class="text-muted">预算周期：<span th:text="${currentMonth}">2024-01</span></p>
                            </div>

                            <div class="col-lg-6">
                                <div class="row g-4 mb-4">
                                    <div class="col-6">
                                        <div class="stats-card bg-white p-4">
                                            <div class="stats-icon used">
                                                <i class="fas fa-sign-out-alt"></i>
                                            </div>
                                            <h6 class="text-muted small mb-2">已使用</h6>
                                            <h4 class="fw-bold text-danger mb-0" th:text="${data.used}">1200</h4>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="stats-card bg-white p-4">
                                            <div class="stats-icon remaining">
                                                <i class="fas fa-sign-in-alt"></i>
                                            </div>
                                            <h6 class="text-muted small mb-2">剩余</h6>
                                            <h4 class="fw-bold text-success mb-0" th:text="${data.remaining}">3800</h4>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <div class="d-flex justify-content-between mb-3">
                                        <span class="fw-bold fs-5">预算进度</span>
                                        <span class="fw-bold fs-5"
                                              th:text="${#numbers.formatDecimal(data.progress, 1, 1) + '%'}">24.0%</span>
                                    </div>
                                    <div class="progress-container shadow-sm"
                                         style="border-radius: 20px; height: 20px; background-color: #f1f3f9;">
                                        <div aria-valuemax="100"
                                             aria-valuemin="0"
                                             aria-valuenow="${data.progress}"
                                             class="progress-bar progress-bar-animated h-100"
                                             role="progressbar" style="transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);" th:classappend="${data.isOver} ? 'bg-danger' : ( ${data.progress} > 80 ? 'bg-warning' : 'bg-success')"
                                             th:style="'width: ' + ${data.progress + '%; border-radius: 20px;'}">
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-between mt-2">
                                        <small class="text-muted">¥0</small>
                                        <small class="text-muted" th:text="${'¥' + data.total}">¥5000</small>
                                    </div>
                                </div>

                                <div class="alert alert-danger border-danger bg-gradient bg-opacity-10 d-flex align-items-center shadow-sm p-3 rounded-3"
                                     style="border-left: 4px solid #dc3545; background: linear-gradient(135deg, rgba(255, 107, 107, 0.1) 0%, rgba(238, 90, 82, 0.1) 100%);"
                                     th:if="${data.isOver}">
                                    <div class="d-flex align-items-center w-100">
                                        <div class="bg-white bg-opacity-25 rounded-circle p-2 me-3 d-flex align-items-center justify-content-center"
                                             style="width: 44px; height: 44px;">
                                            <i class="fas fa-exclamation-triangle fa-lg text-white"></i>
                                        </div>
                                        <div class="flex-grow-1">
                                            <h6 class="alert-heading mb-1 fw-bold text-white">⚠️ 预算超支警告</h6>
                                            <p class="small mb-0 text-white-80">本月支出已超过预算，请注意控制开支</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="my-5">

                        <div class="text-center">
                            <div class="bg-white p-4 rounded-4 shadow-sm mb-4"
                                 style="max-width: 600px; margin: 0 auto;">
                                <h5 class="fw-bold mb-4 fs-4"><i class="fas fa-sliders-h me-2 text-primary"></i>调整预算金额
                                </h5>
                                <form action="/budget/set" class="row g-3 justify-content-center" method="post">
                                    <input name="month" th:value="${currentMonth}" type="hidden">
                                    <div class="col-md-6">
                                        <div class="input-group input-group-lg shadow-sm">
                                            <span class="input-group-text bg-white border-end-0"
                                                  style="border-color: #dee2e6;"><i
                                                    class="fas fa-coins text-warning"></i></span>
                                            <input class="form-control border-start-0 py-3" name="amount" placeholder="输入新的预算金额"
                                                   required style="border-color: #dee2e6;"
                                                   type="number">
                                        </div>
                                    </div>
                                    <div class="col-md-auto">
                                        <button class="btn btn-primary btn-lg shadow-sm px-5 py-3 fw-bold" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none;"
                                                type="submit">
                                            <i class="fas fa-edit me-2"></i>更新预算
                                        </button>
                                    </div>
                                    <div class="col-12 mt-3">
                                        <p class="text-muted small mb-0"><i
                                                class="fas fa-lightbulb me-1 text-warning"></i>建议根据上月实际支出情况调整预算，保持合理的开支规划
                                        </p>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 进度条动画
    document.addEventListener('DOMContentLoaded', function () {
        const progressBars = document.querySelectorAll('.progress-bar-animated');
        progressBars.forEach(bar => {
            const width = bar.style.width;
            bar.style.width = '0';
            setTimeout(() => {
                bar.style.width = width;
            }, 300);
        });
    });
</script>

</body>
</html>
