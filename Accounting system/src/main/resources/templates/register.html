<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户注册 - 个人记账系统</title>
    <!-- 引入 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 复用登录页的渐变背景 */
        body {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative; /* 关键 */
        }

        /* 磨砂玻璃卡片 */
        .register-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            /* 👇 关键：始终置于顶层 */
            z-index: 100;
            position: relative;
        }

        /* === 以下为从登录页复用的动画样式 === */

        .hanabi-item {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: top left;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            cursor: pointer;
            user-select: none;
        }

        .hanabi-item:hover {
            z-index: 101;
        }

        @keyframes breathing-glow {
            0% {
                box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            }
            50% {
                box-shadow: 0 0 25px currentColor;
            }
            100% {
                box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            }
        }

        .hanabi-avatar {
            width: 100px; /* 原为 80px，现改为 100px 与登录页保持一致 */
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            background-color: white;
            animation: breathing-glow 2s infinite ease-in-out alternate;
        }

        .hanabi-bubble {
            background: #fff;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .hanabi-bubble::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
        }

        /* 内部微动作动画 */
        @keyframes pulse-size {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes swing-rotate {
            0% {
                transform: rotate(10deg);
            }
            50% {
                transform: rotate(-10deg);
            }
            100% {
                transform: rotate(10deg);
            }
        }

        @keyframes spin-circle {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes shake-head {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px) rotate(-5deg);
            }
            75% {
                transform: translateX(5px) rotate(5deg);
            }
        }

        @keyframes bobbing {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .anim-pulse {
            animation: pulse-size 2s ease-in-out infinite, breathing-glow 2s infinite ease-in-out alternate;
        }

        .anim-swing {
            animation: swing-rotate 3s ease-in-out infinite, breathing-glow 2s infinite ease-in-out alternate;
        }

        .anim-spin {
            animation: spin-circle 10s linear infinite, breathing-glow 2s infinite ease-in-out alternate;
        }

        .anim-shake {
            animation: shake-head 4s ease-in-out infinite, breathing-glow 2s infinite ease-in-out alternate;
        }

        .anim-bob {
            animation: bobbing 2.5s ease-in-out infinite, breathing-glow 2s infinite ease-in-out alternate;
        }
    </style>
</head>
<body>

<!-- 注册卡片 -->
<div class="register-card">
    <h3 class="text-center mb-2 fw-bold" style="color: #667eea;">
        <i class="fas fa-user-plus me-2"></i>注册新账号
    </h3>
    <p class="text-center text-muted small mb-4">创建用于登录本记账系统的个人档案</p>

    <!-- 错误提示 -->
    <div class="alert alert-danger py-2 small text-center" role="alert" th:if="${msg}" th:text="${msg}"></div>

    <form method="post" th:action="@{/register}">
        <div class="mb-3">
            <label class="form-label text-secondary" for="username">用户名</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                <input class="form-control border-start-0 ps-0" id="username" name="username" placeholder="设置账号"
                       required type="text">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label text-secondary" for="email">邮箱</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                <input class="form-control border-start-0 ps-0" id="email" name="email" placeholder="可选填"
                       type="email">
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label text-secondary" for="password">密码</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                <input class="form-control border-start-0 ps-0" id="password" name="password" placeholder="设置密码"
                       required type="password">
            </div>
        </div>
        <div class="d-grid gap-2">
            <button class="btn btn-success btn-lg" style="background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%); border: none;"
                    type="submit">
                立即注册
            </button>
        </div>
    </form>
    <div class="text-center mt-3">
        <a class="text-decoration-none text-muted small" th:href="@{/login}">
            <i class="fas fa-arrow-left me-1"></i>已有账号？返回登录
        </a>
    </div>
</div>

<!-- 动态舞台 -->
<div id="hanabi-stage"></div>

<!-- JS 逻辑 -->
<script th:inline="javascript">
    const stage = document.getElementById('hanabi-stage');
    const imgPath = /*[[@{/images/hanabi.jpg}]]*/ '/images/hanabi.jpg';
    const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF9F43', '#5f27cd'];
    const animations = ['anim-pulse', 'anim-swing', 'anim-spin', 'anim-shake', 'anim-bob'];
    // 👇 针对注册页调整了文案
    const messages = ['✨ 开启理财之旅', '💰 记好每一笔', '🤖 AI 智能分析', '📈 财富自由!', '🎉 欢迎加入!'];

    const floaters = [];
    const speedBase = 0.8;

    // 生成5个
    for (let i = 0; i < 5; i++) {
        createHanabi(i);
    }

    requestAnimationFrame(updatePositions);

    function createHanabi(index) {
        const el = document.createElement('div');
        el.className = 'hanabi-item';

        const color = colors[index % colors.length];
        const animClass = animations[index % animations.length];
        const msg = messages[index % messages.length];

        let htmlInner = `<div class="hanabi-bubble" style="color: ${color}; border-color: ${color}">${msg}</div>`;
        htmlInner += `<img src="${imgPath}" class="hanabi-avatar ${animClass}" style="border-color: ${color}; color: ${color};">`;
        el.innerHTML = htmlInner;

        stage.appendChild(el);

        const rect = el.getBoundingClientRect();
        // 修改缩放比例逻辑，与登录页保持完全一致 (1.0 ~ 1.5倍)
        const scale = 1.0 + Math.random() * 0.5;

        const realWidth = rect.width * scale;
        const realHeight = rect.height * scale;
        const maxX = window.innerWidth - realWidth;
        const maxY = window.innerHeight - realHeight;

        let x = Math.random() * Math.max(0, maxX);
        let y = Math.random() * Math.max(0, maxY);
        let vx = (Math.random() - 0.5) * speedBase * 2;
        let vy = (Math.random() - 0.5) * speedBase * 2;

        floaters.push({el, x, y, vx, vy, scale, width: realWidth, height: realHeight});
    }

    function updatePositions() {
        const maxX = window.innerWidth;
        const maxY = window.innerHeight;

        floaters.forEach(obj => {
            obj.x += obj.vx;
            obj.y += obj.vy;

            if (obj.x <= 0) {
                obj.x = 0;
                obj.vx *= -1;
            } else if (obj.x + obj.width >= maxX) {
                obj.x = maxX - obj.width;
                obj.vx *= -1;
            }

            if (obj.y <= 0) {
                obj.y = 0;
                obj.vy *= -1;
            } else if (obj.y + obj.height >= maxY) {
                obj.y = maxY - obj.height;
                obj.vy *= -1;
            }

            obj.el.style.transform = `translate3d(${obj.x}px, ${obj.y}px, 0) scale(${obj.scale})`;
        });
        requestAnimationFrame(updatePositions);
    }
</script>

</body>
</html>
