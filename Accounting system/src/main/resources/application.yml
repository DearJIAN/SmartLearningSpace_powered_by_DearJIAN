server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 👇 关键魔法：createDatabaseIfNotExist=true 会让系统发现没有数据库时自动创建一个
    url: jdbc:mysql://localhost:3306/personal_bookkeeping?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    # ⚠️ 重点：请将下面的 123456 修改为你自己本地 MySQL 的密码，否则无法启动！
    password: 123456
  thymeleaf:
    cache: false # 开发环境关闭缓存
    mode: HTML
  sql:
    init:
      # 👇 关键配置：always 表示每次启动都检查并运行 schema.sql
      mode: always
      encoding: UTF-8

# AI 配置
ai:
  doubao:
    api-url: https://ark.cn-beijing.volces.com/api/v3/chat/completions
    api-key: c0a5e654-d53a-4480-87f8-a7956b27601d
    model-id: doubao-seed-1-6-251015

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 控制台打印SQL
