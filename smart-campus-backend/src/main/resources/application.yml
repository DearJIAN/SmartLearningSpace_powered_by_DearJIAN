server:
  port: 8080

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_campus?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-on-borrow: true
  # 自动执行 SQL 初始化脚本配置
  sql:
    init:
      mode: never
      platform: mysql
      # 按顺序执行：先创建 schema，再执行 accounting 和 lost found 脚本
      schema-locations: file:./sql/schema.sql,file:./sql/accounting_schema.sql,file:./sql/lost_found_table.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# AI 配置
ai:
  flask:
    base-url: ${AI_FLASK_BASE_URL:http://127.0.0.1:5000}
    chat-stream-path: ${AI_FLASK_CHAT_STREAM_PATH:/api/chat/stream}
  doubao:
    api-url: ${ARK_CHAT_COMPLETIONS_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
    api-key: ${ARK_API_KEY:}
    model-id: ${ARK_MODEL:doubao-seed-1-6-251015}
